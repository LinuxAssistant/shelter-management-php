name: PHP lint and password integration
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
      - name: Lint PHP
        run: find app bootstrap public scripts -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Install MariaDB test tools
        run: sudo apt-get update && sudo apt-get install -y mariadb-server mariadb-client
      - name: Generate autoloader
        run: composer dump-autoload --no-interaction --no-scripts
      - name: Test password workflows in a disposable database
        run: python3 tests/password-integration.py
