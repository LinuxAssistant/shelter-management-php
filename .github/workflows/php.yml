name: PHP lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Lint PHP
        run: find app bootstrap public scripts -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
